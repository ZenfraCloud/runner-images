# ABOUTME: Weekly base-image digest and action version updates
# ABOUTME: A new flavour needs its own docker entry; the workflow matrices find it on their own

version: 2
updates:
  - package-ecosystem: docker
    directory: /images/tf
    schedule:
      interval: weekly
  # "/" covers .github/workflows only; composite actions need their own directories.
  - package-ecosystem: github-actions
    directories:
      - /
      - /.github/actions/*
    schedule:
      interval: weekly
